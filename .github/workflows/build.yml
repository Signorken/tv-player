# Compila gli installer nativi (Windows .exe, macOS .dmg, Linux .AppImage/.deb/.rpm) e, con un tag, pubblica la Release
# da cui l'app si aggiorna da sola.
#   Rilascio:  git tag v1.3.0 && git push --tags      (la versione viene presa dal tag)
#          oppure Actions > Build > Run workflow con il campo "Versione" compilato (es. 1.3.2)
#   Prova:     Actions > Build > Run workflow a campo vuoto (solo artefatti, nessuna Release)
name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione da pubblicare (es. 1.3.2). Vuoto = solo compilazione di prova, nessuna Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux AppImage deb rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Dipendenze di sistema (rpm)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Versione dal tag e repository per gli aggiornamenti
        shell: bash
        run: |
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"
          V=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; elif [[ -n "${{ inputs.version }}" ]]; then V="${{ inputs.version }}"; fi
          if [[ -n "$V" ]]; then npm version "$V" --no-git-tag-version --allow-same-version; echo "RELEASE=1" >> "$GITHUB_ENV"; fi
      - run: npm ci
      - name: ffmpeg universale (macOS Intel + Apple Silicon)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir /tmp/ffx && cd /tmp/ffx && npm init -y >/dev/null && npm_config_arch=x64 npm i ffmpeg-static
          F="$GITHUB_WORKSPACE/node_modules/ffmpeg-static/ffmpeg"
          if lipo -create "$F" /tmp/ffx/node_modules/ffmpeg-static/ffmpeg -output /tmp/ffmpeg-universal; then cp /tmp/ffmpeg-universal "$F"; else echo "::warning::ffmpeg non universale"; fi
          codesign --force -s - "$F" || true
      - run: npm run build
      - name: Compila (e pubblica se è un tag)
        shell: bash
        run: |
          if [[ "$RELEASE" == "1" ]]; then P=always; else P=never; fi
          npx electron-builder ${{ matrix.target }} --publish $P
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false   # nessuna firma: vedi README
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest*.yml
          if-no-files-found: error

  # Pacchetti per le TV: Android TV/Google TV/Fire OS (.apk), LG webOS (.ipk), Samsung Tizen (.wgt), Hisense VIDAA (.zip)
  tv:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Versione
        run: |
          V="0.0.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; elif [[ -n "${{ inputs.version }}" ]]; then V="${{ inputs.version }}"; fi
          echo "VER=$V" >> "$GITHUB_ENV"
          npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm ci
      - run: npm run build
      - name: webOS (.ipk), Tizen (.wgt), VIDAA (.zip)
        run: |
          mkdir -p out
          ./scripts/dist.sh
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VER\"/" dist/webos/appinfo.json
          sed -i "s/ version=\"1.0.0\"/ version=\"$VER\"/" dist/tizen/config.xml
          npm i -g @webos-tools/cli
          ares-package dist/webos -o out
          for f in out/*.ipk; do mv "$f" "out/MAXENTA-$VER-webos.ipk"; done
          (cd dist/tizen && zip -qr "../../out/MAXENTA-$VER-tizen-unsigned.wgt" .)
          (cd dist/vidaa && zip -qr "../../out/MAXENTA-$VER-vidaa.zip" .)
      - name: Android TV / Google TV / Fire OS (.apk)
        run: |
          pip install pillow
          # firma sempre uguale (così l'APK si installa sopra la versione precedente senza perdere i dati):
          # il secret ANDROID_DEBUG_KEYSTORE contiene il keystore in base64; senza secret Gradle ne crea uno nuovo a ogni build
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore && echo "firma: keystore fisso"; else echo "firma: keystore temporaneo (manca il secret ANDROID_DEBUG_KEYSTORE)"; fi
          sh packaging/android/setup.sh
          cd android-tv/android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../../out/MAXENTA-$VER-android-tv.apk"
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      - uses: actions/upload-artifact@v4
        with:
          name: tv-packages
          path: out/*
          if-no-files-found: error
      - name: Pubblica l'aggiornamento per i gusci delle TV (ramo "updates")
        if: env.VER != '0.0.0'
        run: |
          mkdir -p /tmp/upd && cp www/app.js /tmp/upd/app.js && cp www/css/app.css /tmp/upd/app.css
          echo "{\"version\":\"$VER\",\"minShell\":1}" > /tmp/upd/version.json
          cd /tmp/upd && git init -q && git checkout -q -b updates
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "MAXENTA $VER"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Allega alla Release
        if: env.VER != '0.0.0'
        run: gh release upload "v$VER" out/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
